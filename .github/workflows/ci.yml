name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build · clippy · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The e2e tests verify rendered PDFs with `pdftotext` (poppler); without
      # it they fall back to a brittle raw-byte scan. Install it so CI takes
      # the reliable extraction path (as local dev does).
      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Cache
        uses: Swatinem/rust-cache@v2
      # Formatting is not yet enforced (the codebase is hand-formatted, not
      # rustfmt-normalized); reported for visibility, does not fail the build.
      - name: Formatting (advisory)
        continue-on-error: true
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  layout-fidelity:
    name: "Layout fidelity (vs original SATySFi)"
    # Rebuilds every corpus document with the port and compares its PDF LAYOUT
    # (word bounding boxes via poppler `pdftotext`) against the reference PDF
    # the ORIGINAL OCaml SATySFi (0.0.11) produced — vendored under
    # `scripts/layout_fidelity_corpus/`, and the fixed point
    # `scripts/layout_fidelity_baseline.json` was recorded against.
    #
    # It does NOT install the original typesetter to re-render those references.
    # It used to, via `nix develop`, and that was the bug: SATySFi finds its
    # stdlib and fonts on its own default config path, so the flake's build
    # produced slightly different references than the ones the baseline came
    # from, and the job failed reporting a regression in the PORT that the port
    # had not committed (see the RUSTYFI_GEN_REFS comment in
    # crates/rustyfi/tests/layout_fidelity.rs). Regenerating references is now
    # opt-in and belongs to a deliberate re-baselining, not to CI.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
          # The corpus documents AND their upstream reference PDFs are vendored
          # under `scripts/layout_fidelity_corpus/`, so there is nothing to
          # check out beyond this repo (it used to need `submodules: recursive`
          # for the 11 docs-corpus/* submodules).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      # The two host tools the harness shells out to. python3 is preinstalled on
      # the runner; poppler supplies `pdftotext -bbox`, which is how word boxes
      # come out of both PDFs.
      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      # The corpus docs set Japanese text in the bundled IPAex fonts, so the
      # sha1-pinned fonts must be present (else the port falls back to base-14
      # and every Japanese run is unencodable).
      - name: Download fonts (scripts/download-fonts.sh)
        run: sh scripts/download-fonts.sh
      # The script self-skips (green) if a prerequisite is somehow absent.
      - name: Layout-fidelity test (vs the vendored SATySFi references)
        run: cargo test -p rustyfi --test layout_fidelity -- --ignored --nocapture

  corpus:
    name: corpus regression (real-world packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The regression corpus: the author's real-world SATySFi packages. These
      # are SATySFi packages, published under their own upstream names — the
      # `satysfi-` prefix here is theirs and is NOT this port's old name, so it
      # must survive the satysfi->rustyfi rename untouched. (It did not once:
      # all three were rewritten to `rustyfi-*`, repositories that do not
      # exist, and this job failed at checkout.)
      #
      # The harness lexes/parses every .saty/.satyh/.satyg in these repos and
      # enforces "never panic" + a lex-coverage floor + a parse ratchet (see
      # crates/rustyfi-syntax/tests/corpus.rs). It deliberately does NOT
      # require full compilation: it guards the FRONT END against regressions
      # on real input, which is a cheaper and more stable signal than an
      # end-to-end render (that is what the layout-fidelity job is for).
      - name: Checkout satysfi-class-jlreq
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/satysfi-class-jlreq
          path: corpus/satysfi-class-jlreq
      - name: Checkout satysfi-latexcmds
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/satysfi-latexcmds
          path: corpus/satysfi-latexcmds
      - name: Checkout satysfi-xpath
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/satysfi-xpath
          path: corpus/satysfi-xpath
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Run corpus regression
        env:
          RUSTYFI_CORPUS_DIR: >-
            ${{ github.workspace }}/corpus/satysfi-class-jlreq:${{ github.workspace }}/corpus/satysfi-latexcmds:${{ github.workspace }}/corpus/satysfi-xpath
        run: cargo test -p rustyfi-syntax --test corpus -- --nocapture
