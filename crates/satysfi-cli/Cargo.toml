[package]
name = "satysfi-cli"
description = "SATySFi command line interface: compile .saty documents to PDF"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "satysfi-rust"
path = "src/main.rs"

[features]
# Forward the registry HTTP client feature to satysfi-satyrographos (plan §8).
# Off by default so the default build/test run stays offline; enable for a
# release binary that fetches `http(s)://` registry tarballs.
default = []
http = ["satysfi-satyrographos/http"]

[dependencies]
satysfi-syntax.workspace = true
satysfi-backend.workspace = true
satysfi-lang.workspace = true
satysfi-loader.workspace = true
satysfi-pdf.workspace = true
satysfi-satyrographos.workspace = true
clap.workspace = true
anyhow.workspace = true
sha2.workspace = true

[dev-dependencies]
# Test-only: tests/fonts.rs writes a temporary fonts.satysfi-hash /
# default-font.satysfi-hash pair and uses serde_json to serialize the paths
# correctly (rather than hand-formatting JSON strings).
serde_json = "1"
