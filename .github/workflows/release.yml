name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload to"
        required: true
        type: string

# The default token is read-only; uploading assets needs write.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

jobs:
  fonts:
    runs-on: ubuntu-latest
    env:
      RUSTYFI_FONTCACHE: ${{ github.workspace }}/.fontcache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Cache the pinned downloads
        uses: actions/cache@v4
        with:
          path: .fontcache
          key: fonts-${{ hashFiles('scripts/download-fonts.sh') }}

      - name: Fetch the pinned faces
        run: sh scripts/download-fonts.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: |
            lib-rustyfi/dist/fonts
            lib-rustyfi/dist/hash
          retention-days: 1

  build:
    name: ${{ matrix.target }}
    needs: fonts
    runs-on: ${{ matrix.os }}
    env:
      DIR: rustyfi-${{ github.event.release.tag_name || inputs.tag }}-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            exe: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            exe: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            exe: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            exe: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin rustyfi --target ${{ matrix.target }}

      - name: Smoke test
        run: ./target/${{ matrix.target }}/release/rustyfi${{ matrix.exe }} --version

      #   bin/rustyfi[.exe]
      #   lib/rustyfi/dist/packages/          0.0 packages
      #   lib/rustyfi/dist/fonts/             the faces + licences  (artifact)
      #   lib/rustyfi/dist/hash/              font name -> file     (artifact)
      #   lib/rustyfi/dist-v01/packages/      0.1 packages
      #   share/rustyfi/config.toml           shipped defaults (<exe>/../share)
      #   share/man/man1/rustyfi.1
      #   share/doc/rustyfi/README.md, LICENSE
      - name: Stage archive
        run: |
          mkdir -p "stage/$DIR/bin" "stage/$DIR/lib/rustyfi" \
                   "stage/$DIR/share/rustyfi" "stage/$DIR/share/doc/rustyfi" \
                   "stage/$DIR/share/man/man1"
          cp "target/${{ matrix.target }}/release/rustyfi${{ matrix.exe }}" "stage/$DIR/bin/"
          cp -r lib-rustyfi/dist lib-rustyfi/dist-v01 "stage/$DIR/lib/rustyfi/"
          "target/${{ matrix.target }}/release/rustyfi${{ matrix.exe }}" man \
              > "stage/$DIR/share/man/man1/rustyfi.1"
          test -s "stage/$DIR/share/man/man1/rustyfi.1"
          cp config.toml "stage/$DIR/share/rustyfi/"
          cp README.md LICENSE "stage/$DIR/share/doc/rustyfi/"
          find "stage/$DIR" -name .gitignore -delete

      - name: Add the bundled fonts
        uses: actions/download-artifact@v4
        with:
          name: fonts
          path: stage/${{ env.DIR }}/lib/rustyfi/dist

      - name: Pack (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          tar -C stage -czf "$DIR.${{ matrix.archive }}" "$DIR"
          shasum -a 256 "$DIR.${{ matrix.archive }}" > "$DIR.${{ matrix.archive }}.sha256"

      - name: Pack (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "stage/${env:DIR}" -DestinationPath "${env:DIR}.${{ matrix.archive }}"
          (Get-FileHash "${env:DIR}.${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower() +
            "  ${env:DIR}.${{ matrix.archive }}" | Set-Content "${env:DIR}.${{ matrix.archive }}.sha256"

      # `--clobber` makes a re-run idempotent instead of a duplicate-asset error.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "$DIR.${{ matrix.archive }}" \
            "$DIR.${{ matrix.archive }}.sha256" \
            --repo "${{ github.repository }}" --clobber
