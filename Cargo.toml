[workspace]
resolver = "2"
members = [
    "crates/satysfi-syntax",
    "crates/satysfi-backend",
    "crates/satysfi-lang",
    "crates/satysfi-pdf",
    "crates/satysfi-cli",
    "crates/satysfi-loader",
    "crates/satysfi-satyrographos",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]

[workspace.dependencies]
syan = { path = "../syan2-ergo/core" }
satysfi-syntax = { path = "crates/satysfi-syntax" }
satysfi-backend = { path = "crates/satysfi-backend" }
satysfi-lang = { path = "crates/satysfi-lang" }
satysfi-pdf = { path = "crates/satysfi-pdf" }
satysfi-loader = { path = "crates/satysfi-loader" }
satysfi-satyrographos = { path = "crates/satysfi-satyrographos" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pdf-writer = "0.13"
safegraph = "0.1"
ttf-parser = "0.25"
newer-type = "0.3"
newer-type-std = "0.3"
# Raster image decoding for `load-image` (docs/plans/math-images.md §Slice
# 1). Slice 1 only needs PNG (the checked-in test fixture) and JPEG (cheap,
# pure-Rust, and the format v0.0.6 special-cases for `DCTDecode`
# passthrough — not implemented yet, but decoding it to flat RGB8 like any
# other format costs nothing extra); the rest of `image`'s default formats
# (avif/bmp/dds/exr/ff/gif/hdr/ico/pnm/qoi/tga/tiff/webp) and its `rayon`
# feature are left off to keep the dependency footprint minimal.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
