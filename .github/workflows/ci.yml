name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build · clippy · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The e2e tests verify rendered PDFs with `pdftotext` (poppler); without
      # it they fall back to a brittle raw-byte scan. Install it so CI takes
      # the reliable extraction path (as local dev does).
      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Cache
        uses: Swatinem/rust-cache@v2
      # Formatting is not yet enforced (the codebase is hand-formatted, not
      # rustfmt-normalized); reported for visibility, does not fail the build.
      - name: Formatting (advisory)
        continue-on-error: true
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  layout-fidelity:
    name: "Layout fidelity (vs original SATySFi)"
    # Rebuilds every corpus document with the port and compares its PDF LAYOUT
    # (word bounding boxes via poppler `pdftotext`) against a reference PDF
    # generated by the ORIGINAL OCaml SATySFi (0.0.11, from the flake) — see
    # docs/plans/design-layout-fidelity.md. Runs in `nix develop` so the
    # reference typesetter, poppler, and python3 all come from the pinned flake.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
          # The corpus documents AND their upstream reference PDFs are vendored
          # under `scripts/layout_fidelity_corpus/`, so there is nothing to
          # check out beyond this repo (it used to need `submodules: recursive`
          # for the 11 docs-corpus/* submodules).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      # Install Nix + the flake's toolchain: the original SATySFi 0.0.11 (the
      # reference typesetter), poppler `pdftotext`, and python3. The layout
      # test's #[ignore]d body sees `satysfi` on PATH and generates the
      # reference PDFs with it (--gen-refs).
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      # The corpus docs set Japanese text in the bundled IPAex fonts, so the
      # sha1-pinned fonts must be present (else the port falls back to base-14
      # and every Japanese run is unencodable).
      - name: Download fonts (scripts/download-fonts.sh)
        run: sh scripts/download-fonts.sh
      # Run inside `nix develop` so satysfi / pdftotext / python3 come from the
      # pinned flake; cargo comes from the rustup toolchain on the inherited
      # PATH. The script self-skips (green) if a prerequisite is somehow absent.
      - name: Layout-fidelity test (vs original SATySFi)
        run: nix develop --command cargo test -p rustyfi --test layout_fidelity -- --ignored --nocapture

  corpus:
    name: rustyfi-* corpus regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The regression corpus: the author's real-world SATySFi packages. The
      # harness lexes/parses every .saty/.satyh/.satyg in these repos and
      # enforces "never panic" + a lex-coverage floor (see
      # crates/rustyfi-syntax/tests/corpus.rs). It does NOT require full
      # compilation — this port is a v0.0.x subset without stdlib loading.
      - name: Checkout rustyfi-class-jlreq
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/rustyfi-class-jlreq
          path: corpus/rustyfi-class-jlreq
      - name: Checkout rustyfi-latexcmds
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/rustyfi-latexcmds
          path: corpus/rustyfi-latexcmds
      - name: Checkout rustyfi-xpath
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/rustyfi-xpath
          path: corpus/rustyfi-xpath
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Run corpus regression
        env:
          RUSTYFI_CORPUS_DIR: >-
            ${{ github.workspace }}/corpus/rustyfi-class-jlreq:${{ github.workspace }}/corpus/rustyfi-latexcmds:${{ github.workspace }}/corpus/rustyfi-xpath
        run: cargo test -p rustyfi-syntax --test corpus -- --nocapture
