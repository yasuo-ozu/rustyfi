[package]
name = "rustyfi-pdf"
description = "PDF output backend for SATySFi (pdf-writer based, base-14 fonts)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
authors.workspace = true

[dependencies]
rustyfi-backend.workspace = true
pdf-writer.workspace = true
thiserror.workspace = true
ttf-parser.workspace = true
serde.workspace = true
# Not (yet) a workspace-shared dependency: `fonts.rs` is the only consumer of
# JSON parsing in this workspace today, so it is declared directly here
# rather than promoted to `[workspace.dependencies]` (see fonts.rs's module
# doc for why plain JSON was chosen over hand-rolling a parser).
serde_json = "1"
# Font subsetting (D5): typst's `glyf`/CFF
# subsetter, used to shrink an embedded `FontFile2` to only the glyphs a
# document actually uses. `default-features = false` drops the
# `variable-fonts` feature (skrifa/write-fonts/kurbo) — this port never
# instantiates a variable font to a static instance, so `subset` (not
# `subset_with_variations`) is the only entry point used.
subsetter = { version = "0.2.6", default-features = false }

[dev-dependencies]
# PDF object-model READER, used only to inspect this crate's own output in
# `tests/pdf_image.rs`. The writer re-emits an imported page from the neutral
# `ObjRepr` grammar `rustyfi-backend` defines, not from lopdf's object model,
# so nothing under `src/` ever needed it — and as a normal dependency it put
# `rayon`, `rand`/`getrandom` and three date/time crates into every downstream
# build, none of which `wasm32-unknown-unknown` supports.
lopdf.workspace = true
# Slice 1 (raster images) end-to-end test: compile
# a real `.saty`-shaped document through rustyfi-lang (`load-image` +
# `use-image-by-width`), then render it with this crate's own `render_pdf`.
# rustyfi-lang has no dependency back on rustyfi-pdf, so this is a one-way,
# test-only edge, not a cycle.
rustyfi-lang.workspace = true
rustyfi-syntax.workspace = true

