[package]
name = "rustyfi-lsp"
description = "Language Server Protocol server and single-file diagnostics for SATySFi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
authors.workspace = true

[dependencies]
# The ONLY hard dependency of the analysis half (`analysis`, `line_index`,
# `version`): lexing + parsing, both generations. Deliberately not
# `rustyfi-lang` / `rustyfi-loader` — see the crate doc comment for why
# single-file elaboration cannot produce honest diagnostics.
rustyfi-syntax.workspace = true
# The parser framework `rustyfi-syntax`'s grammar is written in. Needed
# directly because this crate drives the grammar rules itself rather than
# through `parse_file`: it chooses the generation, keeps the tree, and — for
# the symbol outline and the semantic model — parses `File`'s fields one at a
# time so a half-typed buffer still yields everything before the error. All of
# that is `<T as Parse<_>>::parse`. Not a new crate in this workspace:
# `rustyfi-syntax` already depends on it.
syan.workspace = true

# The protocol half only. `serde_json` is already in this workspace's
# dependency graph (`rustyfi`, `rustyfi-pdf`), so it is not a new crate; it is
# behind the default-on `server` feature all the same, so a
# `wasm32-unknown-unknown` consumer of `analyze` can build with
# `default-features = false` and pull in nothing but `rustyfi-syntax`.
serde_json = { version = "1", optional = true }

# Everything that touches the filesystem, and ONLY that. Two callers:
#
#   * go-to-definition on a `@require:`/`@import:` header, which calls the very
#     `resolve_require`/`resolve_import` the compiler's loader calls, so the
#     editor and the build cannot disagree about which file a header names —
#     reimplementing the candidate-extension search here would be four lines
#     that drift;
#   * the whole-program tier (`project`): dependency resolution against the
#     filesystem, then the compiler's own elaborate → typecheck → `:>`-check
#     front half.
#
# Neither is wasm-safe (`rustyfi-loader` reads paths), which is exactly why
# they are optional — `--no-default-features` leaves the `analyze` seam with
# `rustyfi-syntax` as its only dependency.
rustyfi-loader = { workspace = true, optional = true }
rustyfi-lang = { workspace = true, optional = true }

[features]
default = ["server", "typecheck"]
# The stdio JSON-RPC server (`server`, `jsonrpc` modules) and everything that
# needs a runtime JSON encoder or the filesystem. Off ⇒ the crate is the pure,
# no-I/O, wasm-safe `analyze`/`build_model`/`hover`/`definition`/`completions`
# seam and nothing else.
server = ["dep:serde_json", "dep:rustyfi-loader"]
# The whole-program tier (`project` module, and the server's use of it).
typecheck = ["dep:rustyfi-loader", "dep:rustyfi-lang"]
