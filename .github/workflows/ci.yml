name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The `syan` parser framework is a **path dependency** (`../syan2-ergo/core`
  # in the workspace Cargo.toml). CI checks out `yasuo-ozu/syan` at this ref
  # into a sibling `syan2-ergo/` directory so the path resolves.
  #
  # PREREQUISITE: the ergonomics API this project consumes (span-carrying
  # ParseError, #[derive(TokenLeaves)], the atom-generic Group family,
  # IntoParseStream for Vec) currently lives on syan's `api-ergonomics`
  # branch, which MUST be pushed to `yasuo-ozu/syan` for CI to compile.
  # Once that work merges to syan's default branch, change this to `main`
  # (and, if desired, repoint the Cargo.toml path back to `../syan2/core`).
  SYAN_REF: api-ergonomics

jobs:
  test:
    name: build · clippy · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this project
        uses: actions/checkout@v4
        with:
          path: rustyfi-rust-converted
      - name: Checkout syan (path dependency) as ../syan2-ergo
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/syan
          ref: ${{ env.SYAN_REF }}
          path: syan2-ergo
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The e2e tests verify rendered PDFs with `pdftotext` (poppler); without
      # it they fall back to a brittle raw-byte scan. Install it so CI takes
      # the reliable extraction path (as local dev does).
      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustyfi-rust-converted
      # Formatting is not yet enforced (the codebase is hand-formatted, not
      # rustfmt-normalized); reported for visibility, does not fail the build.
      - name: Formatting (advisory)
        continue-on-error: true
        working-directory: rustyfi-rust-converted
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: rustyfi-rust-converted
        run: cargo clippy --workspace --all-targets
      - name: Test
        working-directory: rustyfi-rust-converted
        run: cargo test --workspace

  image-diff:
    name: "PDF image-diff (visual regression)"
    # `runs-on: ubuntu-latest` (a rolling image) pins poppler+freetype only
    # as tightly as GitHub's `ubuntu-latest` label does; the goldens under
    # crates/rustyfi-cli/tests/golden_images/ were authored against
    # `pdftoppm version 25.10.0` (docs/plans/design-pdf-image-diff-ci.md
    # §4/§6's poppler-pinning discipline). The `pdftoppm -v` step below logs
    # the actual version on every run so a runner-image poppler bump shows
    # up as a visible, deliberate line in the job log rather than a mystery
    # flake; if drift ever bites, the documented escape hatch is pinning a
    # `container:` image on this job instead of `runs-on`.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this project
        uses: actions/checkout@v4
        with:
          path: rustyfi-rust-converted
      - name: Checkout syan (path dependency) as ../syan2-ergo
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/syan
          ref: ${{ env.SYAN_REF }}
          path: syan2-ergo
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustyfi-rust-converted
      # 1. pin poppler (as tightly as the runner image allows) — the goldens
      #    were authored against THIS version; the next step logs it.
      - name: Install poppler-utils (pdftoppm)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Log pdftoppm version (goldens are pinned to this)
        run: pdftoppm -v
      # 2. fetch the sha1-pinned fonts (network) so the embedded-font
      #    fixtures (realfont.saty, cjk.saty) run instead of self-skipping —
      #    unlike the `test` job above, this job needs them.
      - name: Download fonts (scripts/download-fonts.sh)
        working-directory: rustyfi-rust-converted
        run: sh scripts/download-fonts.sh
      # 3. run ONLY the image-diff test, including its #[ignore]d body.
      - name: PDF image-diff test
        working-directory: rustyfi-rust-converted
        run: cargo test -p rustyfi-cli --test pdf_image_diff -- --ignored --nocapture
      # 4. on failure, upload actual/diff PNGs for eyeballing.
      - name: Upload image-diff failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-diff-failures
          path: rustyfi-rust-converted/target/golden_images_out/

  corpus:
    name: rustyfi-* corpus regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this project
        uses: actions/checkout@v4
        with:
          path: rustyfi-rust-converted
      - name: Checkout syan (path dependency) as ../syan2-ergo
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/syan
          ref: ${{ env.SYAN_REF }}
          path: syan2-ergo
      # The regression corpus: the author's real-world SATySFi packages. The
      # harness lexes/parses every .saty/.satyh/.satyg in these repos and
      # enforces "never panic" + a lex-coverage floor (see
      # crates/rustyfi-syntax/tests/corpus.rs). It does NOT require full
      # compilation — this port is a v0.0.x subset without stdlib loading.
      - name: Checkout rustyfi-class-jlreq
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/rustyfi-class-jlreq
          path: corpus/rustyfi-class-jlreq
      - name: Checkout rustyfi-latexcmds
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/rustyfi-latexcmds
          path: corpus/rustyfi-latexcmds
      - name: Checkout rustyfi-xpath
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/rustyfi-xpath
          path: corpus/rustyfi-xpath
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustyfi-rust-converted
      - name: Run corpus regression
        working-directory: rustyfi-rust-converted
        env:
          RUSTYFI_CORPUS_DIR: >-
            ${{ github.workspace }}/corpus/rustyfi-class-jlreq:${{ github.workspace }}/corpus/rustyfi-latexcmds:${{ github.workspace }}/corpus/rustyfi-xpath
        run: cargo test -p rustyfi-syntax --test corpus -- --nocapture
