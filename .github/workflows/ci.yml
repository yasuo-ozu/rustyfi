name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build · clippy · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The e2e tests verify rendered PDFs with `pdftotext` (poppler); without
      # it they fall back to a brittle raw-byte scan. Install it so CI takes
      # the reliable extraction path (as local dev does).
      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Cache
        uses: Swatinem/rust-cache@v2
      # Formatting is not yet enforced (the codebase is hand-formatted, not
      # rustfmt-normalized); reported for visibility, does not fail the build.
      - name: Formatting (advisory)
        continue-on-error: true
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace

      # The release archive ships `share/man/man1/rustyfi.1`, generated by this
      # subcommand from the clap tree. Just prove it still produces a page.
      - name: Man page
        run: |
          cargo run --quiet --bin rustyfi -- man > rustyfi.1
          test -s rustyfi.1

  layout-fidelity:
    name: "Layout fidelity (vs original SATySFi)"
    # Rebuilds every corpus document with the port and compares its PDF LAYOUT
    # (word bounding boxes via poppler `pdftotext`) against the reference PDF
    # the ORIGINAL OCaml SATySFi (0.0.11) produced — vendored under
    # `layout-tests/corpus/`, and the fixed point
    # `layout-tests/baseline.json` was recorded against.
    #
    # It does NOT install the original typesetter to re-render those references,
    # and must not start: SATySFi finds its stdlib and fonts on its own default
    # config path, so a `nix develop` build produced slightly different
    # references than the ones the baseline came from and the job failed
    # reporting a regression in the PORT that the port had not committed.
    # Regenerating references is opt-in and belongs to a deliberate
    # re-baselining, not to CI.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
          # The corpus documents AND their upstream reference PDFs are vendored
          # under `layout-tests/corpus/`, so there is nothing to check out
          # beyond this repo.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      # The two host tools the harness shells out to. python3 is preinstalled on
      # the runner; poppler supplies `pdftotext -bbox`, which is how word boxes
      # come out of both PDFs.
      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      # The pinned archives, kept across runs so the steady state never reaches
      # the upstream font servers at all — GUST, which serves the two Latin
      # Modern zips, intermittently refuses connections from the runners (see
      # the note in `download-fonts.sh`). Safe by construction: every archive
      # carries a sha1 in that script, and it re-verifies a cached file before
      # using it, so a restored copy is checked exactly as a freshly downloaded
      # one is. Keyed on the script, which is where the URLs and their
      # checksums live, so re-pinning a font invalidates the cache.
      - name: Cache the pinned font archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rustyfi-fontcache
          key: font-archives-${{ hashFiles('download-fonts.sh') }}
          # Editing the script for any reason — a comment, a new face — changes
          # the key and would otherwise mean a fully cold refetch, which is
          # exactly the moment the outage above bites. Fall back to the newest
          # existing archive cache instead: the script re-verifies every sha1,
          # so a stale entry whose pin changed is re-downloaded on its own
          # merits and the untouched ones are still reused.
          restore-keys: |
            font-archives-
      # The corpus docs set Japanese text in the bundled IPAex fonts, so the
      # sha1-pinned fonts must be present (else the port falls back to base-14
      # and every Japanese run is unencodable).
      - name: Download fonts (download-fonts.sh)
        run: sh download-fonts.sh
        env:
          RUSTYFI_FONTCACHE: ${{ runner.temp }}/rustyfi-fontcache
      # The script self-skips (green) if a prerequisite is somehow absent.
      - name: Layout-fidelity test (vs the vendored SATySFi references)
        run: cargo test -p rustyfi --test layout_fidelity -- --ignored --nocapture

  packages:
    name: "real packages (font / class / normal)"
    # Installs three real Satyrographos packages and builds a document with
    # one. This is the only job that reaches the network for anything but a
    # checkout: `satysfi-fonts-theano` declares an `extra-source` — an upstream
    # font zip and its sha256 — that `install` fetches, verifies and unzips,
    # which is the whole point of the `.opam` support.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Build the CLI
        run: cargo build --bin rustyfi

      # The packages, from the repositories Satyrographos' own index points at.
      - name: Checkout satysfi-fonts-theano
        uses: actions/checkout@v4
        with:
          repository: na4zagin3/SATySFi-fonts-theano
          path: pkgs/fonts-theano
      - name: Checkout slydifi
        uses: actions/checkout@v4
        with:
          repository: monaqa/slydifi
          path: pkgs/slydifi
      - name: Checkout satysfi-xpath
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/satysfi-xpath
          path: pkgs/xpath

      # Same cache, and deliberately the same key, as the layout-fidelity job
      # above: whichever run populates it first spares every later one the
      # download.
      - name: Cache the pinned font archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rustyfi-fontcache
          key: font-archives-${{ hashFiles('download-fonts.sh') }}
          # Editing the script for any reason — a comment, a new face — changes
          # the key and would otherwise mean a fully cold refetch, which is
          # exactly the moment the outage above bites. Fall back to the newest
          # existing archive cache instead: the script re-verifies every sha1,
          # so a stale entry whose pin changed is re-downloaded on its own
          # merits and the untouched ones are still reused.
          restore-keys: |
            font-archives-
      # The faces the standard library needs, then the standard library itself,
      # INTO THE ROOT THE PACKAGES INSTALL INTO — the order matters. Every font
      # package merges its entries into the one shared
      # `dist/hash/fonts.satysfi-hash`, so seeding the root afterwards would
      # overwrite what they contributed.
      - name: Seed the root with the bundled standard library
        env:
          RUSTYFI_FONTCACHE: ${{ runner.temp }}/rustyfi-fontcache
        run: |
          sh download-fonts.sh
          mkdir -p root/dist
          cp -r lib-rustyfi/dist/. root/dist/
          # The port vendors its own copy of xpath. This job's point is to
          # install the real package, so the vendored one gets out of the way —
          # otherwise the install refuses (an unmanaged file is there) or, worse,
          # the document below builds against the vendored copy and the install
          # is never exercised at all.
          rm -rf root/dist/packages/xpath root/dist/packages/xpath-gr

      # A font package: nothing to copy until its `.opam` has run.
      - name: Install a font package
        run: |
          ./target/debug/rustyfi install ./pkgs/fonts-theano --dest ./root
          test -f root/dist/fonts/fonts-theano/TheanoDidot-Regular.otf
          # Upstream's Yojson `fonts.satysfi-hash`, which the port reads: an
          # installed face has to be nameable, not merely present — and merged
          # in beside the standard library's own entries, not over them.
          grep -q "fonts-theano:TheanoDidot" root/dist/hash/fonts.satysfi-hash
          grep -q "ipaexm" root/dist/hash/fonts.satysfi-hash

      - name: Install a class package
        run: |
          ./target/debug/rustyfi install ./pkgs/slydifi --dest ./root
          test -d root/dist/packages/class-slydifi

      # An ordinary package: it declares two libraries, so `--library` names one.
      - name: Install a normal package
        run: |
          ./target/debug/rustyfi install ./pkgs/xpath --dest ./root --library xpath
          test -d root/dist/packages/xpath

      - name: List what landed
        run: ./target/debug/rustyfi list --dest ./root

      # Build a real document: the bundled stdlib and fonts seeded above, plus
      # the package just installed. The PDF is REMOVED first —
      # xpath commits its built documentation, so a stale file would make this
      # pass without building anything.
      - name: Build a document with an installed package
        run: |
          rm -f pkgs/xpath/doc/xpath-doc.pdf
          RUSTYFI_LIB_ROOT="$PWD/root" ./target/debug/rustyfi build ./pkgs/xpath --doc xpath-doc
          test -s pkgs/xpath/doc/xpath-doc.pdf

      # Typeset in a face the font package installed, named through the
      # SHARED `fonts.satysfi-hash`: the copy above put the standard library's
      # entries in the same file the package contributed to, and both names have
      # to resolve out of it.
      - name: Typeset in an installed font
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          cat > theano.saty <<'SATY'
          @require: stdja
          let-inline ctx \theano it =
            read-inline (ctx |> set-font Latin (`fonts-theano:TheanoDidot`, 1.0, 0.0)) it
          in
          document (| title = {t}; author = {a}; show-title = false; show-toc = false; |) '<
            +p { \theano{Latin in Theano} and 日本語 in IPAex. }
          >
          SATY
          RUSTYFI_LIB_ROOT="$PWD/root" ./target/debug/rustyfi theano.saty -o theano.pdf
          # The package's face AND the standard library's, in one document.
          pdffonts theano.pdf | grep -qi "kryukov"
          pdffonts theano.pdf | grep -qi "information-technology"

  corpus:
    name: corpus regression (real-world packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The regression corpus: the author's real-world SATySFi packages,
      # published under their own upstream names — the `satysfi-` prefix here is
      # theirs and is NOT this port's old name, so it must survive the
      # satysfi->rustyfi rename untouched. Rewriting all three to `rustyfi-*`
      # once broke this job at checkout: those repositories do not exist.
      #
      # The harness lexes/parses every .saty/.satyh/.satyg in these repos and
      # enforces "never panic" + a lex-coverage floor + a parse ratchet (see
      # crates/rustyfi-syntax/tests/corpus.rs). It deliberately does NOT
      # require full compilation: it guards the FRONT END against regressions
      # on real input, which is a cheaper and more stable signal than an
      # end-to-end render (that is what the layout-fidelity job is for).
      - name: Checkout satysfi-class-jlreq
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/satysfi-class-jlreq
          path: corpus/satysfi-class-jlreq
      - name: Checkout satysfi-latexcmds
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/satysfi-latexcmds
          path: corpus/satysfi-latexcmds
      - name: Checkout satysfi-xpath
        uses: actions/checkout@v4
        with:
          repository: yasuo-ozu/satysfi-xpath
          path: corpus/satysfi-xpath
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Run corpus regression
        env:
          RUSTYFI_CORPUS_DIR: >-
            ${{ github.workspace }}/corpus/satysfi-class-jlreq:${{ github.workspace }}/corpus/satysfi-latexcmds:${{ github.workspace }}/corpus/satysfi-xpath
        run: cargo test -p rustyfi-syntax --test corpus -- --nocapture
