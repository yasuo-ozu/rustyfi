[package]
name = "rustyfi-lang"
description = "Abstract syntax tree, elaboration, evaluator, and primitives for SATySFi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
authors.workspace = true

[dependencies]
rustyfi-syntax.workspace = true
rustyfi-backend.workspace = true
thiserror.workspace = true
# Raster image decoding for `load-image`.
image.workspace = true
# PDF object-model reader for `load-pdf-image`, behind the default-on
# `pdf-image` feature — see `[features]` below for why it can be turned off.
lopdf = { workspace = true, optional = true }
# Knuth-Liang hyphenation (D4): en-US
# patterns only, embedded at compile time (no dictionary files to ship at
# runtime) — the same Liang/TeX pattern data upstream's
# `dist/hyph/english.rustyfi-hyph` carries.
hyphenation = { version = "0.8.4", features = ["embed_en-us"] }
# 0.1.0 Slice 1 finale (v1-finale-spec.md §5.1): `compile_document_v1`'s
# signature is fixed to `files: &[rustyfi_loader::LoadedFile]` (un-merged,
# plural), so this is now a real dependency, not just a test harness one.
# No cycle: rustyfi-loader depends only on rustyfi-syntax.
rustyfi-loader.workspace = true
# L5a (prim-retype-sweep §2.2): UAX #15 normalization + UAX #29 grapheme
# segmentation for the 0.1-only string prims (`normalize-string-to-nf{c,d}`,
# `split-grapheme-cluster`). Declared directly here (NOT promoted to
# `[workspace.dependencies]`) per this crate's own Cargo.toml boundary for
# this slice of work — pure Rust, table-embedded, no feature flags needed;
# upstream uses uunf/uuseg for exactly these two purposes.
unicode-normalization = "0.1"
unicode-segmentation = "1"

[features]
default = ["pdf-image"]
# `load-pdf-image`'s reader. On by default: every host build wants it, and
# turning it off changes what one primitive DOES, not what exists — the name
# stays registered in `primitives.rs`, `prim_types.rs` and
# `typecheck::PRIMITIVE_NAMES` either way, so the tables stay consistent and a
# document that names it gets an honest runtime error instead of "unbound".
#
# It is a feature because of `wasm32-unknown-unknown`, where `lopdf` cannot be
# built at all: it pulls in `rayon` (threads), `rand`/`getrandom` (no backend
# on that target) and three date/time crates. Nothing is lost there in any
# case — the primitive takes a FILESYSTEM path, and a browser has no
# filesystem.
pdf-image = ["dep:lopdf"]
